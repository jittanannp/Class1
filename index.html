<script>
// --- SUPABASE CONFIGURATION ---
// กรุณาเปลี่ยน SUPABASE_URL และ SUPABASE_KEY ให้เป็นของคุณ
const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// Global State
let currentUser = null;
let currentRole = null;
let allStudents = [];
let localStream = null;
let peerCall = null;
let peer = null;

// --- INITIALIZATION ---
window.onload = function() {
    const today = new Date().toISOString().split('T')[0];
    if (document.getElementById('attendanceDate')) document.getElementById('attendanceDate').value = today;
    if (document.getElementById('reportDate')) document.getElementById('reportDate').value = today;
    initPeer();
};

function togglePassword() {
    const passInput = document.getElementById('password');
    passInput.type = passInput.type === 'password' ? 'text' : 'password';
}

// --- AUTHENTICATION ---
async function login() {
    const emailInput = document.getElementById('email').value.trim();
    const passwordInput = document.getElementById('password').value.trim();
    const roleInput = document.getElementById('role').value;
    const msg = document.getElementById('loginMessage');

    msg.innerText = "";
    if (!emailInput || !passwordInput) {
        msg.innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";
        return;
    }

    currentRole = roleInput;

    if (roleInput === 'teacher') {
        currentUser = { email: emailInput, name: "คุณครูผู้สอน", role: "teacher" };
        showSystemPage();
    } else {
        if (supabase) {
            const { data, error } = await supabase.from('students').select('*').or(`student_id.eq.${emailInput},student_email.eq.${emailInput}`).single();
            if (error || !data) {
                msg.innerText = "ไม่พบข้อมูลนักเรียน รหัสหรืออีเมลไม่ถูกต้อง";
                return;
            }
            currentUser = data;
        } else {
            currentUser = { student_id: emailInput, fullname: "นักเรียน ตัวอย่าง", classroom: "ม.5/1", student_gpa: "3.50", role: "student" };
        }
        showSystemPage();
    }
}

function showSystemPage() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('systemPage').style.display = 'block';

    if (currentRole === 'teacher') {
        document.getElementById('teacherMenu').style.display = 'block';
        document.getElementById('studentMenu').style.display = 'none';
        document.getElementById('sidebarUser').innerText = `👨‍🏫 ${currentUser.name}`;
        showSection('teacherDashboard');
        loadTeacherDashboard();
        loadStudentList();
    } else {
        document.getElementById('studentMenu').style.display = 'block';
        document.getElementById('teacherMenu').style.display = 'none';
        document.getElementById('sidebarUser').innerText = `👨‍🎓 ${currentUser.fullname || currentUser.student_id}`;
        showSection('studentDashboard');
        loadStudentDashboard();
    }
}

function logout() {
    currentUser = null;
    currentRole = null;
    document.getElementById('systemPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
}

function showSection(sectionId) {
    const sections = document.querySelectorAll('.page-section');
    sections.forEach(sec => sec.classList.remove('active'));
    const target = document.getElementById(sectionId);
    if (target) {
        target.classList.add('active');
        target.style.display = 'block';
    }
    sections.forEach(sec => {
        if (sec.id !== sectionId) sec.style.display = 'none';
    });
}

// --- TEACHER FUNCTIONS ---
async function loadTeacherDashboard() {
    if (!supabase) return;
    const { data: students } = await supabase.from('students').select('*');
    if (students) {
        document.getElementById('teacherTotalStudents').innerText = students.length;
    }
}

async function loadStudentList() {
    if (!supabase) return;
    const { data } = await supabase.from('students').select('*');
    if (data) {
        allStudents = data;
        renderStudentTable(allStudents);
    }
}

function renderStudentTable(students) {
    const tbody = document.getElementById('studentTable');
    if (!tbody) return;
    tbody.innerHTML = students.map((s, idx) => `
        <tr>
            <td>${idx + 1}</td>
            <td>${s.student_id}</td>
            <td>${s.fullname}</td>
            <td>${s.student_email || '-'}</td>
            <td>${s.classroom || '-'}</td>
            <td>${s.student_gpa || '0.00'}</td>
            <td><button class="btn btn-danger" onclick="deleteStudent('${s.student_id}')">🗑️ ลบ</button></td>
        </tr>
    `).join('');
}

async function addStudent() {
    const id = document.getElementById('student_id').value.trim();
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('student_email').value.trim();
    const cls = document.getElementById('classroom').value.trim();
    const gpa = parseFloat(document.getElementById('student_gpa').value) || 0;

    if (!id || !name) return alert("กรุณากรอกรหัสและชื่อนักเรียน");

    if (supabase) {
        const { error } = await supabase.from('students').insert([{ student_id: id, fullname: name, student_email: email, classroom: cls, student_gpa: gpa }]);
        if (error) alert("เกิดข้อผิดพลาด: " + error.message);
        else {
            alert("เพิ่มนักเรียนสำเร็จ");
            loadStudentList();
        }
    }
}

async function deleteStudent(id) {
    if (!confirm("คุณต้องการลบข้อมูลนักเรียนรหัส " + id + " หรือไม่?")) return;
    if (supabase) {
        await supabase.from('students').delete().eq('student_id', id);
        loadStudentList();
    }
}

function filterStudents() {
    const q = document.getElementById('studentSearch').value.toLowerCase();
    const filtered = allStudents.filter(s => s.student_id.toLowerCase().includes(q) || s.fullname.toLowerCase().includes(q));
    renderStudentTable(filtered);
}

// --- STUDENT DASHBOARD ---
async function loadStudentDashboard() {
    const profile = document.getElementById('studentProfile');
    if (profile && currentUser) {
        profile.innerHTML = `
            <div class="profile-item"><small>ชื่อ-นามสกุล</small><strong>${currentUser.fullname}</strong></div>
            <div class="profile-item"><small>รหัสนักเรียน</small><strong>${currentUser.student_id}</strong></div>
            <div class="profile-item"><small>ห้องเรียน</small><strong>${currentUser.classroom || 'ม.5/1'}</strong></div>
        `;
        document.getElementById('myGPA').innerText = currentUser.student_gpa || '0.00';
    }
}

// --- VIDEO CALL (PEERJS) ---
function initPeer() {
    if (typeof Peer === 'undefined') return;
    peer = new Peer();

    peer.on('open', id => {
        const myIdEl = document.getElementById('my-id');
        if (myIdEl) myIdEl.innerText = id;
    });

    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            call.answer(stream);
            peerCall = call;
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });
    });
}
